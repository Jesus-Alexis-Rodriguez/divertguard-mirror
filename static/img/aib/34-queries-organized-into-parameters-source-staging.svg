<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 268" width="320" height="268" role="img" font-family="'IBM Plex Sans', system-ui, sans-serif" aria-label="Queries organized into parameters, source, staging, dimension, fact and QA folders; measures organized into base, analytical, report and QA folders"><title>Queries organized into parameters, source, staging, dimension, fact and QA folders; measures organized into base, analytical, report and QA folders</title><defs><symbol id="pbi-folder" viewBox="0 0 20 20"><path d="M4.5 3C3.11929 3 2 4.11929 2 5.5V14.5C2 15.8807 3.11929 17 4.5 17H15.5C16.8807 17 18 15.8807 18 14.5V7.5C18 6.11929 16.8807 5 15.5 5H9.70711L8.21967 3.51256C7.89148 3.18437 7.44636 3 6.98223 3H4.5ZM3 5.5C3 4.67157 3.67157 4 4.5 4H6.98223C7.18115 4 7.37191 4.07902 7.51256 4.21967L8.79289 5.5L7.43934 6.85355C7.34557 6.94732 7.21839 7 7.08579 7H3V5.5ZM3 8H7.08579C7.48361 8 7.86514 7.84196 8.14645 7.56066L9.70711 6H15.5C16.3284 6 17 6.67157 17 7.5V14.5C17 15.3284 16.3284 16 15.5 16H4.5C3.67157 16 3 15.3284 3 14.5V8Z"/></symbol></defs><rect x="8" y="4" width="148" height="22" rx="4" fill="#0d6e6e"/><text x="82.0" y="19" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Queries</text><use href="#pbi-folder" x="12" y="32" width="11" height="11" fill="#5F6E7C"/><text x="28" y="41" font-size="8.3" fill="#16202A" text-anchor="start">Parameters</text><use href="#pbi-folder" x="12" y="52" width="11" height="11" fill="#5F6E7C"/><text x="28" y="61" font-size="8.3" fill="#16202A" text-anchor="start">Source</text><use href="#pbi-folder" x="12" y="72" width="11" height="11" fill="#5F6E7C"/><text x="28" y="81" font-size="8.3" fill="#16202A" text-anchor="start">Staging / Helper</text><use href="#pbi-folder" x="12" y="92" width="11" height="11" fill="#5F6E7C"/><text x="28" y="101" font-size="8.3" fill="#16202A" text-anchor="start">Dimension</text><use href="#pbi-folder" x="12" y="112" width="11" height="11" fill="#5F6E7C"/><text x="28" y="121" font-size="8.3" fill="#16202A" text-anchor="start">Fact</text><use href="#pbi-folder" x="12" y="132" width="11" height="11" fill="#5F6E7C"/><text x="28" y="141" font-size="8.3" fill="#16202A" text-anchor="start">QA</text><rect x="164" y="4" width="148" height="22" rx="4" fill="#5DB0B0"/><text x="238.0" y="19" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Measures</text><use href="#pbi-folder" x="168" y="32" width="11" height="11" fill="#5F6E7C"/><text x="184" y="41" font-size="8.3" fill="#16202A" text-anchor="start">Base</text><use href="#pbi-folder" x="168" y="52" width="11" height="11" fill="#5F6E7C"/><text x="184" y="61" font-size="8.3" fill="#16202A" text-anchor="start">Analytical</text><use href="#pbi-folder" x="168" y="72" width="11" height="11" fill="#5F6E7C"/><text x="184" y="81" font-size="8.3" fill="#16202A" text-anchor="start">Report</text><use href="#pbi-folder" x="168" y="92" width="11" height="11" fill="#5F6E7C"/><text x="184" y="101" font-size="8.3" fill="#16202A" text-anchor="start">QA</text><line x1="164" y1="180" x2="164" y2="180" stroke="none"/><rect x="8" y="184" width="304" height="76" rx="6" fill="#F4F7F9" stroke="#DCE3E8" stroke-width="1"/><text x="18" y="200" font-size="8.6" fill="#16202A" text-anchor="start" font-weight="bold">Why folders, not one flat list</text><text x="18" y="214" font-size="8" fill="#5F6E7C" text-anchor="start">A build like this needs dozens of queries and measures.</text><text x="18" y="227" font-size="8" fill="#5F6E7C" text-anchor="start">Helper queries stay unloaded; only fact, dimension and QA</text><text x="18" y="240" font-size="8" fill="#5F6E7C" text-anchor="start">tables reach the model. Ask AI for the folder, not just the code.</text></svg>