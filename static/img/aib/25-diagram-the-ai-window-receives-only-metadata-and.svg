<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 194" width="320" height="194" role="img" font-family="'IBM Plex Sans', system-ui, sans-serif" aria-label="Diagram: the AI window receives only metadata and synthetic rows; real data stays on the managed device; code flows right, data never flows left"><title>Diagram: the AI window receives only metadata and synthetic rows; real data stays on the managed device; code flows right, data never flows left</title><rect x="4" y="4" width="150" height="184" rx="6" fill="#FFFFFF" stroke="#0d6e6e" stroke-width="1.5"/><text x="79" y="22" font-size="11" fill="#16202A" text-anchor="middle" font-weight="bold" >AI chat window</text><text x="79" y="36" font-size="9.5" fill="#5F6E7C" text-anchor="middle" font-weight="normal" >sees only the shape</text><text x="16" y="58" font-size="10" fill="#0B6B3A" text-anchor="start" font-weight="normal" >✓ column names</text><text x="16" y="75" font-size="10" fill="#0B6B3A" text-anchor="start" font-weight="normal" >✓ data dictionary</text><text x="16" y="92" font-size="10" fill="#0B6B3A" text-anchor="start" font-weight="normal" >✓ metric sentences</text><text x="16" y="109" font-size="10" fill="#0B6B3A" text-anchor="start" font-weight="normal" >✓ synthetic rows</text><text x="16" y="126" font-size="10" fill="#0B6B3A" text-anchor="start" font-weight="normal" >✓ error text (redacted)</text><text x="16" y="143" font-size="10" fill="#0B6B3A" text-anchor="start" font-weight="normal" >✓ your formulas</text><text x="16" y="170" font-size="10.5" fill="#aa5d19" text-anchor="start" font-weight="bold" >✗ never a real row</text><rect x="166" y="4" width="150" height="184" rx="6" fill="#F4F7F9" stroke="#DCE3E8" stroke-width="1"/><text x="241" y="22" font-size="11" fill="#16202A" text-anchor="middle" font-weight="bold" >Your work device</text><text x="241" y="36" font-size="9.5" fill="#5F6E7C" text-anchor="middle" font-weight="normal" >holds the real data</text><text x="178" y="58" font-size="10" fill="#16202A" text-anchor="start" font-weight="normal" >• the real extract</text><text x="178" y="75" font-size="10" fill="#16202A" text-anchor="start" font-weight="normal" >• Power BI Desktop</text><text x="178" y="92" font-size="10" fill="#16202A" text-anchor="start" font-weight="normal" >• the measures run here</text><text x="178" y="109" font-size="10" fill="#16202A" text-anchor="start" font-weight="normal" >• hand counts</text><text x="178" y="126" font-size="10" fill="#16202A" text-anchor="start" font-weight="normal" >• validation log</text><text x="178" y="170" font-size="10.5" fill="#0B6B3A" text-anchor="start" font-weight="bold" >PHI stays inside</text><line x1="150" y1="112" x2="164" y2="112" stroke="#5F6E7C" stroke-width="1.5"/><path d="M163 107 L170 112 L163 117 z" fill="#5F6E7C"/><text x="160" y="102" font-size="9" fill="#5F6E7C" text-anchor="middle" font-weight="normal" >code</text><line x1="170" y1="140" x2="156" y2="140" stroke="#aa5d19" stroke-width="1.5"/><path d="M163 135 L153 140 L163 145 z" fill="#aa5d19"/><line x1="155" y1="133" x2="167" y2="147" stroke="#aa5d19" stroke-width="2.5"/><line x1="167" y1="133" x2="155" y2="147" stroke="#aa5d19" stroke-width="2.5"/><text x="160" y="160" font-size="9" fill="#aa5d19" text-anchor="middle" font-weight="normal" >data</text></svg>