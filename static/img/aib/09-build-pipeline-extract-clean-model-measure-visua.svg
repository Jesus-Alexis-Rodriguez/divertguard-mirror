<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 332" width="320" height="332" role="img" font-family="'IBM Plex Sans', system-ui, sans-serif" aria-label="Build pipeline: extract, clean, model, measure, visual, share"><title>Build pipeline: extract, clean, model, measure, visual, share</title><rect x="8" y="4" width="304" height="44" rx="6" fill="#FFFFFF" stroke="#DCE3E8" stroke-width="1"/><circle cx="28" cy="26.0" r="12" fill="#0d6e6e"/><text x="28" y="30.0" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" >1</text><text x="48" y="21" font-size="12" fill="#16202A" text-anchor="start" font-weight="bold" >Extract</text><text x="48" y="36" font-size="9.5" fill="#5F6E7C" text-anchor="start" font-weight="normal" >One CSV, one row per cabinet transaction</text><text x="306" y="21" font-size="9.5" fill="#0B6B3A" text-anchor="end" font-weight="normal" >IT or the system owner</text><line x1="28" y1="48" x2="28" y2="54" stroke="#5F6E7C" stroke-width="1.5"/><path d="M23 53 L28 60 L33 53 z" fill="#5F6E7C"/><rect x="8" y="60" width="304" height="44" rx="6" fill="#F4F7F9" stroke="#DCE3E8" stroke-width="1"/><circle cx="28" cy="82.0" r="12" fill="#0d6e6e"/><text x="28" y="86.0" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" >2</text><text x="48" y="77" font-size="12" fill="#16202A" text-anchor="start" font-weight="bold" >Clean</text><text x="48" y="92" font-size="9.5" fill="#5F6E7C" text-anchor="start" font-weight="normal" >Power Query: fix types, add date, drop duplicates</text><text x="306" y="77" font-size="9.5" fill="#aa5d19" text-anchor="end" font-weight="normal" >AI writes the steps</text><line x1="28" y1="104" x2="28" y2="110" stroke="#5F6E7C" stroke-width="1.5"/><path d="M23 109 L28 116 L33 109 z" fill="#5F6E7C"/><rect x="8" y="116" width="304" height="44" rx="6" fill="#FFFFFF" stroke="#DCE3E8" stroke-width="1"/><circle cx="28" cy="138.0" r="12" fill="#0d6e6e"/><text x="28" y="14