<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 230" width="320" height="230" role="img" font-family="'IBM Plex Sans', system-ui, sans-serif" aria-label="Loop: data dictionary and design spec feed the AI; drifted answers are corrected by reloading the same documents"><title>Loop: data dictionary and design spec feed the AI; drifted answers are corrected by reloading the same documents</title><rect x="60" y="8" width="200" height="46" rx="6" fill="#0d6e6e"/><text x="160" y="27" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Data Dictionary +</text><text x="160" y="42" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Design Specification</text><line x1="160" y1="54" x2="160" y2="72" stroke="#5F6E7C" stroke-width="1.5"/><path d="M155 71 L160 78 L165 71 z" fill="#5F6E7C"/><rect x="60" y="78" width="200" height="46" rx="6" fill="#FFFFFF" stroke="#DCE3E8" stroke-width="1"/><text x="160" y="97" font-size="11.5" fill="#16202A" text-anchor="middle" font-weight="bold">AI Drafts the Answer</text><text x="160" y="112" font-size="9.3" fill="#5F6E7C" text-anchor="middle">Query, measure, or visual</text><line x1="160" y1="124" x2="160" y2="142" stroke="#5F6E7C" stroke-width="1.5"/><path d="M155 141 L160 148 L165 141 z" fill="#5F6E7C"/><rect x="60" y="148" width="200" height="46" rx="6" fill="#FFF4CE" stroke="#aa5d19" stroke-width="1"/><text x="160" y="167" font-size="11.5" fill="#16202A" text-anchor="middle" font-weight="bold">Compare to the Spec</text><text x="160" y="182" font-size="9.3" fill="#aa5d19" text-anchor="middle">Drifted? Reload the documents.</text><path d="M60 171 C 20 171, 20 31, 56 31" fill="none" stroke="#aa5d19" stroke-width="1.5"/><path d="M50 26 L58 31 L50 36 z" fill="#aa5d19"/><text x="18" y="100" font-size="9" fill="#aa5d19" text-anchor="middle" transform="rotate(-90 18 100)">reload on drift</text></svg>