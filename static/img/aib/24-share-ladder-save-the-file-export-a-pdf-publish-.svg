<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 232" width="320" height="232" role="img" font-family="'IBM Plex Sans', system-ui, sans-serif" aria-label="Share ladder: save the file, export a PDF, publish to a named workspace; never publish to web"><title>Share ladder: save the file, export a PDF, publish to a named workspace; never publish to web</title><rect x="8" y="4" width="304" height="52" rx="6" fill="#FFFFFF" stroke="#DCE3E8" stroke-width="1"/><text x="18" y="22" font-size="11.5" fill="#16202A" text-anchor="start" font-weight="bold" >Save the .pbix</text><text x="306" y="22" font-size="9.5" fill="#0B6B3A" text-anchor="end" font-weight="normal" >have today</text><text x="18" y="37" font-size="9.5" fill="#5F6E7C" text-anchor="start" font-weight="normal" >Opens for anyone with Power BI Desktop. No license.</text><line x1="28" y1="56" x2="28" y2="62" stroke="#5F6E7C" stroke-width="1.5"/><path d="M23 61 L28 68 L33 61 z" fill="#5F6E7C"/><rect x="8" y="68" width="304" height="52" rx="6" fill="#FFFFFF" stroke="#DCE3E8" stroke-width="1"/><text x="18" y="86" font-size="11.5" fill="#16202A" text-anchor="start" font-weight="bold" >Export to PDF</text><text x="306" y="86" font-size="9.5" fill="#0B6B3A" text-anchor="end" font-weight="normal" >have today</text><text x="18" y="101" font-size="9.5" fill="#5F6E7C" text-anchor="start" font-weight="normal" >Goes through the same channel as any confidential</text><text x="18" y="113" font-size="9.5" fill="#5F6E7C" text-anchor="start" font-weight="normal" >document.</text><line x1="28" y1="120" x2="28" y2="126" stroke="#5F6E7C" stroke-width="1.5"/><path d="M23 125 L28 132 L33 125 z" fill="#5F6E7C"/><rect x="8" y="132" width="304" height="52" rx="6" fill="#F4F7F9" stroke="#DCE3E8" stroke-width="1"/><text x="18" y="150" font-size="11.5" fill="#16202A" text-anchor="start" font-weight="bold" >Publish to a named workspace</text><text x="306" y="150" font-size="9.5" fill="#aa5d19" text-anchor="end" font-weight="normal" >ask IT</text><text x="18" y="165" font-size="9.5" fill="#5F6E7C" text-anchor="start" font-weight="normal" >Viewers open it in a browser. IT names the workspace;</text><text x="18" y="177" font-size="9.5" fill="#5F6E7C" text-anchor="start" font-weight="normal" >viewers may need a license.</text><rect x="8" y="196" width="304" height="30" rx="6" fill="#FBEDED" stroke="#C0392B" stroke-width="1"/><text x="18" y="215" font-size="11" fill="#C0392B" text-anchor="start" font-weight="bold" >✗ Publish to web</text><text x="306" y="215" font-size="9.5" fill="#C0392B" text-anchor="end" font-weight="normal" >never: a public link with no login</text></svg>